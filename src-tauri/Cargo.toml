[package]
name = "antai-desktop"
version = "1.0.0"
description = "ANTAI — Autonomous AI Cyber Defense Sentinel Desktop App"
edition = "2024"
authors = ["ANTAI Team"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
strip = true
